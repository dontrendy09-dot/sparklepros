<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 140" fill="none" width="100%" height="100%">
  <!-- Definitions for authentic brand styling -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&amp;family=Cinzel:wght@700;900&amp;display=swap');
      .brand-wordmark {
        font-family: 'Playfair Display', 'Cinzel', Georgia, serif;
        font-weight: 900;
        font-size: 64px;
        fill: #3E0D42;
      }
      .brand-tagline {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 700;
        font-size: 14.5px;
        letter-spacing: 0.44em;
        fill: #3E0D42;
      }
      .sparkle-stroke {
        stroke: #421248;
        stroke-width: 3.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .sparkle-dot {
        fill: #421248;
      }
    </style>
  </defs>

  <!-- Left Sparkle Stars & Circles Cluster matching uploaded artwork -->
  <g transform="translate(10, 8)">
    <!-- Hollow Ring (Far Left) -->
    <circle cx="18" cy="62" r="7.5" stroke="#421248" stroke-width="3" fill="none" />

    <!-- Top Star (Diamond 4-point astroid) -->
    <path
      d="M 52,24 Q 52,44 32,44 Q 52,44 52,64 Q 52,44 72,44 Q 52,44 52,24 Z"
      class="sparkle-stroke"
    />

    <!-- Hollow Ring (Top Right of top star) -->
    <circle cx="94" cy="54" r="6" stroke="#421248" stroke-width="2.6" fill="none" />

    <!-- Lower Center-Right Star (Main Star) -->
    <path
      d="M 72,56 Q 72,82 46,82 Q 72,82 72,108 Q 72,82 98,82 Q 72,82 72,56 Z"
      stroke="#421248"
      stroke-width="3.6"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />

    <!-- Lower-Left Star -->
    <path
      d="M 36,82 Q 36,98 20,98 Q 36,98 36,114 Q 36,98 52,98 Q 36,98 36,82 Z"
      class="sparkle-stroke"
    />

    <!-- Solid Accent Dot (Bottom Right) -->
    <circle cx="98" cy="112" r="4.5" class="sparkle-dot" />
  </g>

  <!-- Wordmark: "Sparkle" + stylized swirl "e" + "Pros" -->
  <g transform="translate(125, 90)">
    <text x="0" y="0" class="brand-wordmark">Sparkl</text>
    
    <!-- Iconic Stylized Swirl Loop "e" -->
    <g transform="translate(225, -28)">
      <!-- Outer curved loop that swirls into the center -->
      <path
        d="M 0,22 C 2,10 8,1 20,1 C 32,1 38,10 38,20 C 38,32 30,36 18,36 C 8,36 0,29 0,19 C 0,9 8,3 18,3 C 27,3 32,9 32,16 C 32,22 27,26 21,26 C 16,26 13,22 14,17 C 15,13 18,10 21,11"
        fill="none"
        stroke="#3E0D42"
        stroke-width="6.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </g>

    <text x="272" y="0" class="brand-wordmark">Pros</text>
  </g>

  <!-- Subtitle Tagline: "STEAM CLEANS BETTER" -->
  <text x="172" y="118" class="brand-tagline">
    STEAM CLEANS BETTER
  </text>
</svg>
